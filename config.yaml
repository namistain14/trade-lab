# trade-lab: PAPER trading only. No exchange keys, no real money.
# Edit from GitHub's web editor; changes apply on the next 5-minute tick.

start_equity_usd: 5000

bots:
  crypto_rules:            # Bot A: crypto scalping, long only. Erdem 29.10: more trades, riskier (x3 paper futures)
    type: crypto_rules
    label: "Bot A — Kripto kurallar (x3 çarpan, sık işlem)"
    tag: "A"
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT"]
    interval: "5m"
    leverage: 3            # Erdem 29.10: x3 (was spot, no leverage)
    fee_rate: 0.0005       # 0.05% per side (typical futures taker fee)
    slippage_rate: 0.0003  # 0.03% worse price on every fill
    position_pct: 0.40     # 40% of equity x3 = 120% notional per trade (was 20%, x1)
    max_open: 3            # was 2
    take_profit_pct: 0.006 # +0.6% price move (= about +1.8% of the stake at x3)
    stop_loss_pct: 0.004   # -0.4% price move
    max_hold_minutes: 120
    trend_filter: false    # Erdem 29.10: also buys below EMA200 (more trades)
    rsi_buy_below: 45      # was 40
    cooldown_minutes: 10   # pause per coin after a trade (was 30)
    max_trades_per_day: 80 # was 40
    daily_loss_limit_pct: 0.05   # stop for the day at -5% (was -2%)

  crypto_bounce:           # Bot A2: spot, no leverage; buys the first green candle after a real drop (works in downtrends)
    type: crypto_rules
    label: "Bot A2 — Kripto: sert düşüş sonrası toparlanma (spot, kaldıraçsız)"
    tag: "A2"
    enabled: false             # Erdem 29.10: kapatıldı
    symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
    interval: "5m"
    fee_rate: 0.001
    slippage_rate: 0.0003
    position_pct: 0.20
    max_open: 2
    take_profit_pct: 0.008   # +0.8%
    stop_loss_pct: 0.006     # -0.6%
    max_hold_minutes: 90
    trend_filter: false
    min_drop_pct: 0.02       # price at least 2% below its 2-hour high
    drop_lookback_candles: 24
    require_green_candle: true
    rsi_buy_below: 30
    max_trades_per_day: 20
    daily_loss_limit_pct: 0.02

  gold_news:               # Bot B1: news-driven gold, leveraged, both directions (observation settings)
    type: gold_news
    label: "Bot B1 — Altın + haber (net +2$ / -3$, hızlı kapanış)"
    tag: "B1"
    enabled: false             # Erdem 29.10: kapatıldı
    symbol: "PAXGUSDT"     # gold-backed token, 24/7 price that tracks gold (paper proxy for XAU/USD)
    interval: "5m"
    leverage: 10           # SPK retail limit for gold is 1:10
    notional_usd: 5000     # position size (margin = notional / leverage = 500 USD)
    spread_usd_per_oz: 0.30   # simulated XAU/USD spread
    slippage_rate: 0.0002
    targets_net: true         # Erdem 23.10: quick small wins, amounts are NET (after spread/slippage)
    take_profit_usd: 2        # close as soon as +2 $ net is in the account
    stop_loss_usd: 3          # ... and cut at -3 $ net
    max_hold_minutes: 240
    news_min_minutes: 5       # headlines are checked every tick; Claude reads them when NEW ones arrive (max every 5 min)
    news_max_minutes: 60      # ...and anyway once an hour so the view never gets stale
    news_max_calls_per_day: 120   # cost cap (about 0.40 USD/day at most)
    min_score: 0.2            # |sentiment| needed to trade (observation mode, was 0.4)
    min_confidence: 0.35      # observation mode (was 0.6)
    max_trades_per_day: 40
    daily_loss_limit_usd: 100

  gold_big:                # Bot B2: same news, but strict signals and bigger targets (costs matter less)
    type: gold_news
    label: "Bot B2 — Altın: sıkı haber eşiği (net +2$ / -3$, hızlı kapanış)"
    tag: "B2"
    enabled: false             # Erdem 29.10: kapatıldı
    symbol: "PAXGUSDT"
    interval: "5m"
    leverage: 10
    notional_usd: 5000
    spread_usd_per_oz: 0.30
    slippage_rate: 0.0002
    targets_net: true         # Erdem 23.10: quick small wins, amounts are NET (after spread/slippage)
    take_profit_usd: 2        # close as soon as +2 $ net is in the account
    stop_loss_usd: 3          # ... and cut at -3 $ net
    max_hold_minutes: 360
    min_score: 0.4
    min_confidence: 0.6
    max_trades_per_day: 15
    daily_loss_limit_usd: 100

  gold_contra:             # Bot B4: CONTRARIAN - trades against the news when price already ignores it
    type: gold_news
    label: "Bot B4 — Altın: haberin TERSİ (TP 15$ / SL 10$)"
    tag: "B4"
    enabled: false             # Erdem 29.10: kapatıldı
    contrarian: true
    symbol: "PAXGUSDT"
    interval: "5m"
    leverage: 10
    notional_usd: 5000
    spread_usd_per_oz: 0.30
    slippage_rate: 0.0002
    take_profit_usd: 15
    stop_loss_usd: 10
    max_hold_minutes: 360
    min_score: 0.3
    min_confidence: 0.45
    max_trades_per_day: 15
    daily_loss_limit_usd: 100

  gold_pro:                # Bot B3: B2 + only London/New York hours + momentum + break-even stop
    type: gold_news
    label: "Bot B3 — Altın: B2 + seans filtresi + momentum (net +2$ / -3$, hızlı kapanış)"
    tag: "B3"
    enabled: false             # Erdem 29.10: kapatıldı
    symbol: "PAXGUSDT"
    interval: "5m"
    leverage: 10
    notional_usd: 5000
    spread_usd_per_oz: 0.30
    slippage_rate: 0.0002
    targets_net: true         # Erdem 23.10: quick small wins, amounts are NET (after spread/slippage)
    take_profit_usd: 2        # close as soon as +2 $ net is in the account
    stop_loss_usd: 3          # ... and cut at -3 $ net
    max_hold_minutes: 360
    min_score: 0.4
    min_confidence: 0.6
    session_hours_utc: [7, 16]   # 10:00-19:00 Istanbul (London + New York)
    momentum: true
    max_trades_per_day: 15
    daily_loss_limit_usd: 100

  gold_consensus:          # Bot B5: trades only when Claude AND GPT read the news the same way (two-model check)
    type: gold_news
    label: "Bot B5 — Altın: Claude + GPT hemfikir (x10, 25.000 $ pozisyon)"
    tag: "B5"
    enabled: true
    consensus: true
    symbol: "PAXGUSDT"
    interval: "5m"
    leverage: 10
    notional_usd: 25000       # Erdem 29.10: 2.500 $ teminat x10 (was 5.000 $ position = 500 $ x10)
    spread_usd_per_oz: 0.30
    slippage_rate: 0.0002
    take_profit_usd: 75       # same price distance as before (15 $ on 5.000 $), scaled to the bigger position
    stop_loss_usd: 50
    max_hold_minutes: 360
    min_score: 0.2            # BOTH models must reach this, in the same direction (was 0.3)
    min_confidence: 0.35      # the lower of the two confidences must reach this (was 0.45)
    pause_minutes: 5          # wait after a trade (was 10)
    news_min_minutes: 5       # B5 now reads the news itself (B1 is off)
    news_max_minutes: 30
    news_max_calls_per_day: 150
    max_trades_per_day: 40    # was 15
    daily_loss_limit_usd: 400 # was 100

  stocks_ai:               # Bot B6: US stocks on Alpaca PAPER account (100k fake USD), Claude + GPT must agree
    type: stocks_alpaca
    label: "Bot B6 — ABD hisse (Alpaca sanal): Claude + GPT hemfikir, 1:4"
    tag: "B6"
    enabled: true
    symbols: ["SPY", "QQQ", "NVDA", "AAPL", "TSLA"]
    leverage: 4               # Erdem 29.10: 1:4 (was 1:2)
    position_pct: 0.25        # 25% of equity x4 = 100% notional per position (was 20% x2)
    max_open: 5
    take_profit_pct: 1.5
    stop_loss_pct: 1.0
    min_confidence: 0.45      # was 0.55
    decide_minutes: 10        # both models are asked every 10 minutes (was 15)
    warmup_minutes: 60        # Erdem 25.10: wakes up 1 hour before the US open (one pre-market view, no orders)
    style: "Be an ACTIVE, aggressive intraday trader: take a position whenever price action or news gives even a moderate edge; do not wait for perfect setups."
    no_new_minutes_before_close: 45
    flatten_minutes_before_close: 15
    daily_loss_limit_pct: 0.04   # was 0.02
    # second tier for now (~1.3 $/day). Top tier = ["claude-fable-5-1"] + ["gpt-6-astra"] (~4 $/day)
    claude_models: ["claude-opus-5-5", "claude-sonnet-5-5"]
    gpt_models: ["gpt-6.1-sol", "gpt-6-luna"]

# Erdem's one-off balance resets: the bot starts again from a clean account (old trades are kept in state as "archive")
resets:
  - id: "b5-5000-2910"
    bot: gold_consensus
    balance: 5000

news:
  model: "claude-haiku-5-5"   # cheap and fast for hourly news reading
  gpt_models: ["gpt-6-luna", "gpt-6.1-sol"]   # second, independent reader of the same headlines (bot B5)
  feeds:
    - "https://news.google.com/rss/search?q=gold+price+when:1d&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=Federal+Reserve+OR+inflation+OR+dollar+when:1d&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=war+OR+geopolitical+OR+sanctions+OR+missile+when:1d&hl=en-US&gl=US&ceid=US:en"
    - "https://feeds.bbci.co.uk/news/world/rss.xml"
    - "https://feeds.bbci.co.uk/news/business/rss.xml"

report:
  model: "claude-sonnet-5-5"  # daily performance review
  gpt_models: ["gpt-6.1-sol", "gpt-6-astra"]   # independent second opinion at the end of the report

# Erdem's one-off paper orders (opened once by the next tick at the market price; no take-profit / stop-loss)
manual_orders:
  - id: "btc-1000-2410"
    bot: crypto_rules
    symbol: BTCUSDT
    usd: 1000
    hold_hours: 24
    note: "Erdem 24.10 17:25: 1000 $ BTC al, yarına kadar tut"
