name: Paper trading tick

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may delay it a little)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # Erdem 05.11: each run starts the next one (GitHub's own schedule fires only ~hourly)

concurrency:
  group: trade-lab
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/usage   # Jarvis usage meter (usage/sitecustomize.py)

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      # Erdem 31.10: GitHub starts this workflow only every ~40 min instead of every 5, so one run now keeps
      # ticking every 3 minutes for ~45 minutes (the next scheduled run queues behind it). State is saved each tick.
      - name: Run the paper bots every 3 minutes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          git config user.name "trade-lab-bot"
          git config user.email "trade-lab-bot@users.noreply.github.com"
          end=$((SECONDS + 50*60))
          while :; do
            t0=$SECONDS
            python lab/run.py || echo "::warning::tick failed"
            git add state/ README.md
            if ! git diff --cached --quiet; then
              git commit -q -m "tick $(date -u +%H:%M)"
              for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
            fi
            [ $((SECONDS + 180)) -ge $end ] && break
            wait=$((180 - (SECONDS - t0))); [ $wait -gt 0 ] && sleep $wait
          done
      # chain: start the next run right away so there is never a gap (the concurrency group queues it behind this one).
      # The 5-minute schedule above stays as a backup in case a chained run is ever lost.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w tick.yml -s queued --json databaseId -q 'length' || echo 0)
          [ "$n" = "0" ] && gh workflow run tick.yml -R "$GITHUB_REPOSITORY" --ref main || echo "a run is already queued"
