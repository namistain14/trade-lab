name: Paper trading tick

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may delay it a little)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-lab
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Run both paper bots
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python lab/run.py
      - name: Save state and dashboard
        run: |
          git config user.name "trade-lab-bot"
          git config user.email "trade-lab-bot@users.noreply.github.com"
          git add state/ README.md
          git diff --cached --quiet && exit 0
          git commit -q -m "tick $(date -u +%H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
