name: Daily report

on:
  schedule:
    - cron: "5 18 * * *"      # 21:05 Istanbul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-lab
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Write today's report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python lab/report.py
      - name: Save report
        run: |
          git config user.name "trade-lab-bot"
          git config user.email "trade-lab-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -q -m "report $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
