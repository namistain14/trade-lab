name: Backtest A

# Research only (Erdem 02.11): replays bot A and alternative crypto rule sets on ~120 days of Binance data.
# No AI calls, no orders. Writes reports/backtest_A.md + .json.
on:
  workflow_dispatch:
    inputs:
      days: {description: "Kaç günlük veri", default: "120"}
      grid: {description: "1 = ayar taraması", default: ""}
      tag: {description: "Rapor adı eki", default: ""}

permissions:
  contents: write

concurrency:
  group: trade-lab-backtest
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/usage   # Jarvis usage meter (usage/sitecustomize.py)

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python lab/backtest.py
        env:
          BT_DAYS: ${{ inputs.days }}
          BT_GRID: ${{ inputs.grid }}
          BT_TAG: ${{ inputs.tag }}
      - name: Save report
        run: |
          git config user.name "trade-lab-bot"
          git config user.email "trade-lab-bot@users.noreply.github.com"
          git add reports/backtest_A*.md reports/backtest_A*.json
          git diff --cached --quiet && exit 0
          git commit -q -m "backtest A"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
